version: "3.9"

# AI 陪练平台 docker-compose
# 复制 training/api/.env.example 为 .env 并填真实值后，再 docker compose up -d
# 注意：.env 不要提交到仓库

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training_dev_pwd}
      POSTGRES_DB: training
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: training/api/Dockerfile
    env_file:
      - ./training/api/.env
    environment:
      DATABASE_URL: postgres://training:${POSTGRES_PASSWORD:-training_dev_pwd}@postgres:5432/training
    ports:
      - "18001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: training/worker/Dockerfile
    env_file:
      - ./training/api/.env
    environment:
      DATABASE_URL: postgres://training:${POSTGRES_PASSWORD:-training_dev_pwd}@postgres:5432/training
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    image: nginx:alpine
    volumes:
      - ./training/admin-web:/usr/share/nginx/html:ro
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  pgdata:
